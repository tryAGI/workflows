name: Auto-approve and auto-merge bot pull requests
on:
  workflow_call:
    secrets:
      PERSONAL_TOKEN:
        required: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false && (github.actor == 'dependabot[bot]' || github.actor == 'HavenDV') && github.repository_owner == 'tryAGI' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Dependabot metadata
        if: ${{ github.actor == 'dependabot[bot]' }}
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Show sender
        run: |
          echo "${{ github.event.pull_request.sender }}"

      - name: Show triggering_actor
        run: |
          echo "${{ github.triggering_actor }}"

      - name: Wait for validation checks
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in $(seq 1 180); do
            checks_json="$(gh pr checks "$PR_URL" --json bucket,name,workflow 2>/dev/null || true)"
            validation_checks="$(jq '[.[] | select(.workflow != "" and .workflow != "Auto-approve and auto-merge bot pull requests")]' <<< "$checks_json")"
            validation_count="$(jq 'length' <<< "$validation_checks")"

            if [ "$validation_count" -eq 0 ]; then
              if [ "$attempt" -eq 30 ]; then
                echo "No independent pull-request validation checks appeared within five minutes." >&2
                exit 1
              fi

              echo "Waiting for an independent validation check to appear..."
              sleep 10
              continue
            fi

            failed_count="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$validation_checks")"
            if [ "$failed_count" -gt 0 ]; then
              jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "Validation failed: \(.workflow) / \(.name) [\(.bucket)]"' <<< "$validation_checks" >&2
              exit 1
            fi

            pending_count="$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$validation_checks")"
            if [ "$pending_count" -eq 0 ]; then
              jq -r '.[] | "Validation complete: \(.workflow) / \(.name) [\(.bucket)]"' <<< "$validation_checks"
              exit 0
            fi

            echo "Waiting for $pending_count validation check(s)..."
            sleep 10
          done

          echo "Validation checks did not finish within 30 minutes." >&2
          exit 1

      - name: Approve a PR
        if: ${{ github.event.pull_request.user.login != 'HavenDV' }}
        run: |
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

      - name: Enable auto-merge
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Failed to enable auto-merge after $attempt attempts." >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 5))
            echo "Attempt $attempt failed. Retrying in $sleep_seconds seconds..."
            sleep "$sleep_seconds"
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
