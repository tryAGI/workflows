name: Reusable SDK .NET Build, Test, and Publish

on:
  workflow_call:
    inputs:
      os:
        description: Runner image.
        required: false
        type: string
        default: ubuntu-latest
      dotnet-version:
        description: .NET SDK version to install.
        required: false
        type: string
        default: 10.0.x
      project-path:
        description: Optional solution or project path.
        required: false
        type: string
        default: ""
      configuration:
        description: Build configuration.
        required: false
        type: string
        default: Release
      enable-caching:
        description: Cache NuGet packages.
        required: false
        type: boolean
        default: false
      run-tests:
        description: Run dotnet test after build.
        required: false
        type: boolean
        default: true
      publish:
        description: Upload the NuGet packages as nuget-packages-<os> for the caller's trusted-publishing job.
        required: false
        type: boolean
        default: true
      auto-stable-release:
        description: Classify and publish a stable SemVer release after a successful main build.
        required: false
        type: boolean
        default: false
      publish-stable:
        description: Must stay false here; stable publishing needs the auto-stable-release action in the caller job.
        required: false
        type: boolean
        default: false
      additional-test-arguments:
        description: Extra arguments passed to dotnet test.
        required: false
        type: string
        default: ""
    secrets:
      api-key:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      API_KEY: ${{ secrets.api-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        if: inputs.enable-caching
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Build
        run: dotnet build
          ${{ inputs.project-path }}
          --configuration ${{ inputs.configuration }}
          --nologo

      - name: Test
        if: inputs.run-tests
        run: dotnet test
          ${{ inputs.project-path }}
          --configuration ${{ inputs.configuration }}
          --nologo
          ${{ inputs.additional-test-arguments }}

      - name: Upload NuGet package artifacts
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ runner.os }}
          path: ./**/*.nupkg
          if-no-files-found: ignore


  auto-stable-release:
    needs: [build]
    if: inputs.publish && inputs.auto-stable-release && github.ref == 'refs/heads/main'
    uses: tryAGI/workflows/.github/workflows/auto-stable-release.yml@main
    with:
      project-path: ${{ inputs.project-path }}
      dotnet-version: ${{ inputs.dotnet-version }}
      configuration: ${{ inputs.configuration }}
      publish-stable: ${{ inputs.publish-stable }}
