name: Automatic stable NuGet release

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        required: false
        default: ''
      os:
        type: string
        required: false
        default: ubuntu-latest
      dotnet-version:
        type: string
        required: false
        default: 10.0.x
      configuration:
        type: string
        required: false
        default: Release
      candidate-source:
        description: artifact for the shared workflow, build for custom workflows.
        type: string
        required: false
        default: artifact
      package-command:
        description: build when GeneratePackageOnBuild is enabled, otherwise pack.
        type: string
        required: false
        default: build
      workloads:
        type: string
        required: false
        default: ''
      zero-major-policy:
        type: string
        required: false
        default: minor
      publish-stable:
        description: >
          Must stay false. A reusable workflow cannot push with NuGet trusted publishing (nuget.org matches the
          caller's workflow file); publish with the tryAGI/workflows/.github/actions/auto-stable-release action
          in a caller job instead.
        type: boolean
        required: false
        default: false

concurrency:
  group: automatic-stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check release mode
        id: credentials
        shell: bash
        env:
          PUBLISH_STABLE: ${{ inputs.publish-stable }}
        run: |
          if [ "$PUBLISH_STABLE" = true ]; then
            echo "::error::publish-stable cannot push from a reusable workflow: NuGet trusted publishing matches the caller's workflow file. Use tryAGI/workflows/.github/actions/auto-stable-release in a caller job."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout SDK
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tooling
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          repository: tryAGI/workflows
          path: release-tooling
          persist-credentials: false

      - name: Download tested package candidates
        if: steps.credentials.outputs.ready == 'true' && inputs.candidate-source == 'artifact'
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-packages-*
          path: ${{ runner.temp }}/release-candidates
          merge-multiple: true

      - name: Setup .NET
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            ${{ inputs.dotnet-version }}
            10.0.x

      - name: Setup Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install requested .NET workloads
        if: steps.credentials.outputs.ready == 'true' && inputs.workloads != ''
        shell: bash
        env:
          WORKLOADS: ${{ inputs.workloads }}
        run: |
          set -euo pipefail
          read -r -a selected <<< "$WORKLOADS"
          dotnet workload install "${selected[@]}"

      - name: Install pinned API compatibility tool
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cd "$(cygpath -u "$RUNNER_TEMP")"
          else
            cd "$RUNNER_TEMP"
          fi
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool \
            --version 10.0.401 \
            --tool-path "$RUNNER_TEMP/release-tools"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "APICOMPAT_PATH=$RUNNER_TEMP/release-tools/apicompat.exe" >> "$GITHUB_ENV"
          else
            echo "APICOMPAT_PATH=$RUNNER_TEMP/release-tools/apicompat" >> "$GITHUB_ENV"
          fi

      - name: Build candidate packages for custom CI
        if: steps.credentials.outputs.ready == 'true' && inputs.candidate-source == 'build'
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE_COMMAND" != build ] && [ "$PACKAGE_COMMAND" != pack ]; then
            echo "Unsupported package command: $PACKAGE_COMMAND" >&2
            exit 1
          fi
          target=()
          if [ -n "$PROJECT_PATH" ]; then target=("$PROJECT_PATH"); fi
          dotnet "$PACKAGE_COMMAND" "${target[@]}" \
            --configuration '${{ inputs.configuration }}' \
            --nologo \
            --maxcpucount:1 \
            -p:UseSharedCompilation=false \
            -p:PackageOutputPath="$RUNNER_TEMP/release-candidates"

      - name: Classify public API changes
        if: steps.credentials.outputs.ready == 'true'
        id: plan
        shell: bash
        env:
          PUBLISH_STABLE: ${{ inputs.publish-stable }}
        run: |
          set -euo pipefail
          python release-tooling/scripts/release_impact.py plan \
            --repo "$GITHUB_WORKSPACE" \
            --packages "$RUNNER_TEMP/release-candidates" \
            --apicompat "$APICOMPAT_PATH" \
            --cache "$RUNNER_TEMP/release-baselines" \
            --zero-major-policy '${{ inputs.zero-major-policy }}' \
            --output "$RUNNER_TEMP/release-plan.json"
          if [ "$PUBLISH_STABLE" != true ]; then
            echo "Report mode: no stable package or tag will be published." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_STEP_SUMMARY"
          level=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["level"])' "$RUNNER_TEMP/release-plan.json")
          if [ "$level" = none ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "release=true"
            echo "version=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/release-plan.json")"
            echo "tag=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/release-plan.json")"
            echo "level=$level"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release impact report
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-impact-report
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
