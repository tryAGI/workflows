name: Lint GitHub Actions Workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - 'tests/test_auto_merge.py'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - 'tests/test_auto_merge.py'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    name: Lint workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          matcher: true
          cache: true
          fail-on-error: true

      - name: Test auto-merge validation failures
        run: python3 -B -m unittest discover -s tests -p test_auto_merge.py
